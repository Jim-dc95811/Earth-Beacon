name: Publish Object Factory v1.0

on:
  push:
    branches:
      - release-object-factory-v1
    paths:
      - .release_ready

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-object-factory-v1
          fetch-depth: 0

      - name: Generate exact accepted v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('Object_Factory_v0.2_TEST.py').read_text(encoding='utf-8')
          replacements = [
              ('VERSION = "0.2 TEST"', 'VERSION = "1.0"'),
              ('raise ValueError("Object Factory v0.2 accepts PNG icons only.")', 'raise ValueError("Object Factory accepts PNG icons only.")'),
              ('self.status = tk.StringVar(value="Factory ready. v0.2 UX simplified; proven object/batch/compass behavior preserved; awaiting live ArcGIS Earth acceptance.")', 'self.status = tk.StringVar(value="Factory ready. Object Factory v1.0 commissioned for ArcGIS Earth.")'),
              ('ttk.Label(t,text="Info text").grid(row=r,column=0,sticky="nw",padx=(0,8),pady=4);self.object_desc=tk.Text(t,height=4,wrap="word");self.object_desc.grid(row=r,column=1,columnspan=3,sticky="nsew",pady=4);t.rowconfigure(r,weight=1);r+=1', 'ttk.Label(t,text="Info text").grid(row=r,column=0,sticky="nw",padx=(0,8),pady=4);self.object_desc=tk.Text(t,height=2,wrap="word");self.object_desc.grid(row=r,column=1,columnspan=3,sticky="ew",pady=4);r+=1'),
              ('outf=ttk.Frame(t);outf.grid(row=r,column=0,columnspan=4,sticky="ew",pady=(8,0));outf.columnconfigure(0,weight=1);ttk.Button(outf,text="CREATE OBJECT KMZ",command=self.create_object).grid(row=0,column=0,sticky="e",ipadx=20,ipady=5)', 'outf=ttk.Frame(t);outf.grid(row=r,column=0,columnspan=4,sticky="ew",pady=(8,12));outf.columnconfigure(0,weight=1);ttk.Button(outf,text="CREATE OBJECT KMZ",command=self.create_object).grid(row=0,column=0,sticky="e",ipadx=20,ipady=5)'),
              ('pf=max(1,math.ceil(max(w,h)/96));', 'pf=max(1,math.ceil(max(w,h)/72));'),
          ]
          for old, new in replacements:
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]}')
              src = src.replace(old, new)
          Path('Object_Factory_v1.0.py').write_text(src, encoding='utf-8')
          PY
          echo "e77e1866e7a87b9824ed6bb1cd0f830f52adb1a2872efe48ede13a581018aa00  Object_Factory_v1.0.py" | sha256sum -c -
          python -m py_compile Object_Factory_v1.0.py
          mkdir -p legacy/Object_Factory_pre1
          git mv Object_Factory_v0.2_TEST.py legacy/Object_Factory_pre1/Object_Factory_v0.2_TEST.py
          rm -f .release_ready
          rm -f .github/workflows/publish-object-factory-v1.yml

      - name: Commit verified v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jim Gaddy"
          git config user.email "jimgdc95811@gmail.com"
          git add -A
          git commit -m "Publish verified Object Factory v1.0 source"
          git push origin HEAD:release-object-factory-v1
