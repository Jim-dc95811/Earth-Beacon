name: Finalize Object Factory GitHub

on:
  push:
    branches:
      - github-finalize

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Trigger Object Factory finalizer final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact accepted preset icon archive
        shell: bash
        run: |
          set -euo pipefail
          git show b46917ec9da0cf27a4ca0521335fe91928ee9209:.release_icons_00 > /tmp/icons.b64
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          text = Path('/tmp/icons.b64').read_text(encoding='utf-8', errors='ignore')
          raw = base64.b64decode(text, validate=False)
          sha = hashlib.sha256(raw).hexdigest()
          expected = 'a14761721e0c7dcf58d7baf6838eabce3e4a349a7142955c86bf8a704eb6a1c7'
          if sha != expected:
              raise SystemExit(f'Icon archive SHA mismatch: {sha}')
          Path('/tmp/icons.zip').write_bytes(raw)
          print('Verified icon archive:', sha, len(raw), 'bytes')
          PY
          rm -rf icons /tmp/icons_restore
          mkdir -p /tmp/icons_restore
          unzip -q /tmp/icons.zip -d /tmp/icons_restore
          cp -a /tmp/icons_restore/icons ./icons
          test "$(find icons -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 15

      - name: Verify exact accepted v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          echo 'e77e1866e7a87b9824ed6bb1cd0f830f52adb1a2872efe48ede13a581018aa00  Object_Factory_v1.0.py' | sha256sum -c -
          python -m py_compile Object_Factory_v1.0.py

      - name: Build complete v1.0 operator package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/Object_Factory_v1.0
          mkdir -p /tmp/Object_Factory_v1.0/icons releases
          cp Object_Factory_v1.0.py Run_Object_Factory.bat sample_objects.txt simple_objects.txt /tmp/Object_Factory_v1.0/
          cp icons/*.png /tmp/Object_Factory_v1.0/icons/
          cp docs/OBJECT_FACTORY_GUIDE.md /tmp/Object_Factory_v1.0/README.md
          cp docs/ArcGIS_Earth_Object_Factory_v1.0_User_Manual.pdf /tmp/Object_Factory_v1.0/
          printf '%s\n' 'ArcGIS Earth Object Factory v1.0' 'Commissioned 2026-10-29' '' 'Accepted source SHA-256:' 'e77e1866e7a87b9824ed6bb1cd0f830f52adb1a2872efe48ede13a581018aa00' '' 'Package rebuilt from the exact accepted v1.0 source and exact accepted 15-file PNG archive.' > /tmp/Object_Factory_v1.0/RELEASE_VERIFICATION.txt
          rm -f releases/ArcGIS_Earth_Object_Factory_v1.0.zip releases/SHA256SUMS.txt
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/releases/ArcGIS_Earth_Object_Factory_v1.0.zip" Object_Factory_v1.0
          cd "$GITHUB_WORKSPACE"
          unzip -t releases/ArcGIS_Earth_Object_Factory_v1.0.zip >/dev/null
          test "$(unzip -Z1 releases/ArcGIS_Earth_Object_Factory_v1.0.zip | grep -E '/icons/[^/]+\.png$' | wc -l)" -eq 15
          sha256sum releases/ArcGIS_Earth_Object_Factory_v1.0.zip docs/ArcGIS_Earth_Object_Factory_v1.0_User_Manual.pdf Object_Factory_v1.0.py > releases/SHA256SUMS.txt

      - name: Clean temporary commissioning files and commit finished repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_chunks .release_exact
          rm -f .release_icons_00 .release_v1_TRIGGER .github/FINALIZE_OBJECT_FACTORY
          rm -f .github/workflows/commission-object-factory-v1.yml .github/workflows/publish-object-factory-v1.yml .github/workflows/promote-object-factory-v1.yml
          rm -f .github/workflows/finalize-object-factory.yml
          git config user.name 'Jim Gaddy'
          git config user.email 'jimgdc95811@gmail.com'
          git add -A
          git commit -m 'Finalize ArcGIS Earth Object Factory v1.0 repository'
          git push origin HEAD:github-finalize
